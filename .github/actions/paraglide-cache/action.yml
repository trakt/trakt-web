name: Paraglide Cache
description: Restores the compiled Paraglide output so the vite plugin can skip recompiling unchanged messages

inputs:
  save:
    description: 'Save the cache at the end of the job. Only for jobs that compile through the vite plugin, which writes the cache manifest the skip relies on'
    required: false
    default: 'false'

  variant:
    description: 'Cache namespace. The plugin writes a manifest per output structure (production builds emit message-modules, test and dev emit locale-modules), so jobs that compile differently need separate caches or the skip never matches. The test variant caches the English-only project vitest compiles into node_modules/vitest-i18n, so translation updates do not invalidate it'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the cache was restored for the exact inputs'
    value: ${{ steps.save.outputs.cache-hit || steps.restore.outputs.cache-hit || steps.save-test.outputs.cache-hit || steps.restore-test.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Recalling the Runes aka Restore & Save Paraglide Cache
      id: save
      if: inputs.save == 'true' && inputs.variant != 'test'
      uses: actions/cache@v4
      with:
        path: |
          projects/client/i18n/project.inlang
          projects/client/src/lib/paraglide
        key: paraglide-v2${{ inputs.variant && format('-{0}', inputs.variant) || '' }}-${{ hashFiles('bun.lock', 'projects/client/i18n/project.inlang/settings.json', 'projects/client/i18n/meta/**', 'projects/client/i18n/messages/**', 'projects/client/i18n/generator/**') }}

    - name: Recalling the Runes aka Restore Paraglide Cache
      id: restore
      if: inputs.save != 'true' && inputs.variant != 'test'
      uses: actions/cache/restore@v4
      with:
        path: |
          projects/client/i18n/project.inlang
          projects/client/src/lib/paraglide
        key: paraglide-v2${{ inputs.variant && format('-{0}', inputs.variant) || '' }}-${{ hashFiles('bun.lock', 'projects/client/i18n/project.inlang/settings.json', 'projects/client/i18n/meta/**', 'projects/client/i18n/messages/**', 'projects/client/i18n/generator/**') }}

    - name: Recalling the Runes aka Restore & Save Test Paraglide Cache
      id: save-test
      if: inputs.save == 'true' && inputs.variant == 'test'
      uses: actions/cache@v4
      with:
        path: projects/client/node_modules/vitest-i18n
        key: paraglide-v4-test-${{ hashFiles('bun.lock', 'projects/client/i18n/project.inlang/settings.json', 'projects/client/i18n/meta/**', 'projects/client/i18n/generator/**') }}

    - name: Recalling the Runes aka Restore Test Paraglide Cache
      id: restore-test
      if: inputs.save != 'true' && inputs.variant == 'test'
      uses: actions/cache/restore@v4
      with:
        path: projects/client/node_modules/vitest-i18n
        key: paraglide-v4-test-${{ hashFiles('bun.lock', 'projects/client/i18n/project.inlang/settings.json', 'projects/client/i18n/meta/**', 'projects/client/i18n/generator/**') }}
