<!DOCTYPE html>
<html
  lang="%paraglide.lang%"
  dir="%paraglide.textDirection%"
  data-theme="%theme.current%"
  data-seasonal-theme="%theme.seasonal%"
  data-mobile-os="%mobile.os%"
  data-device="%device.type%"
  data-deployment-sha="%deployment.sha%"
>
  <head>
    <meta charset="utf-8" />
    <!-- CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        img-src 'self' data: https://*.trakt.tv https://trakt.tv https://secure.gravatar.com https://i0.wp.com https://i1.wp.com https://i2.wp.com https://*.reddit.com https://*.youtube.com https://*.ytimg.com https://fonts.gstatic.com https://t.co;
        script-src 'self' 'unsafe-eval' 'unsafe-inline' https://app.trakt.tv;
        script-src-elem 'self' 'unsafe-inline' https://*.cloudflareinsights.com https://*.trakt.tv/ https://cdnjs.cloudflare.com https://cdn.plyr.io https://*.youtube.com https://open.spotify.com https://*.spotifycdn.com;
        worker-src 'self' blob:;
        connect-src 'self' https://*.jsdelivr.net https://*.googleapis.com https://*.gstatic.com https://trakt.tv https://*.trakt.tv https://*.sentry.io https://*.ingest.de.sentry.io wss://db0xjc18bh.execute-api.us-east-1.amazonaws.com wss://*.execute-api.us-east-1.amazonaws.com https://*.typesense.net https://cdn.plyr.io https://noembed.com;
        font-src 'self' data: https://fonts.gstatic.com http://fonts.gstatic.com;
        style-src 'self' 'unsafe-inline' https://*.googleapis.com https://*.jsdelivr.net https://*.trakt.tv https://cdn.plyr.io;
        style-src-elem 'self' 'unsafe-inline' https://*.googleapis.com https://*.jsdelivr.net https://*.trakt.tv https://cdn.plyr.io;
        frame-src 'self' https://trakt.tv http://localhost:3000 https://*.youtube.com https://open.spotify.com;
      "
    >
    <!-- PWA -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest">
    <script>
      if ('serviceWorker' in navigator) {
        globalThis.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault();
          globalThis.install = event;
        });

        globalThis.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', {
            type: 'module',
          }).catch(() => {});
        });
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    >
    <meta name="apple-mobile-web-app-title" content="Trakt" />
    <meta name="application-name" content="Trakt Web" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=%device.scale%, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- Icons -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/pwa/ios/apple-touch-icon.png"
    />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="preconnect"
      href="https://media.trakt.tv"
      crossorigin="anonymous"
    />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300..700&family=Roboto+Mono:wght@400;600&family=Tajawal:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Base styles -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: -moz-available;
        height: -webkit-fill-available;
        height: fill-available;
      }

      html::before {
        content: "";
        height: 100vh;
        width: 100vw;
        z-index: calc(var(--layer-background) - 1);

        display: block;
        position: fixed;

        background-color: var(--color-background);
      }

      body {
        background-color: var(--color-background);
        color: var(--color-foreground);
        font-family: "Roboto", "Tajawal", Arial, sans-serif;
      }

      code,
      pre,
      kbd,
      samp {
        font-family: "Roboto Mono", "Courier New", monospace;
      }

      body:has(dialog[open]),
      body.dialog-open {
        overflow: hidden;
      }
    </style>

    %sveltekit.head%
  </head>
  <body>
    <div
      style="display: contents"
      data-sveltekit-preload-code="viewport"
      data-sveltekit-preload-data="tap"
    >
      %sveltekit.body%
    </div>
  </body>
</html>
