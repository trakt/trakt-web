<script>
(() => {
  const STYLES_SHARE = 0.4;
  const LEVEL_EMPTY = 34;
  const LEVEL_FULL = -2;
  const STYLES_TIMEOUT_MS = 20000;
  const SPLASH_DELAY_MS = 250;
  const HANDOFF_MS = 800;
  const BAR_START_SIZE = 6;
  const FLIGHT_MS = 700;
  const APP_SCRIPT = /\/_app\/immutable\/.+\.js$/;

  const html = document.documentElement;
  const loader = document.querySelector('.boot-loader');
  const splash = loader.querySelector('.boot-loader-splash');
  const logo = loader.querySelector('.boot-loader-logo');
  const level = loader.querySelector('.boot-loader-level');
  const markLit = loader.querySelector('.boot-loader-mark-lit');
  const percent = loader.querySelector('.boot-loader-percent');

  const stylesTotal = Number(loader.dataset.css) || 1;
  const scriptsTotal = Number(loader.dataset.js) || 1;
  const scripts = new Set();
  const startedAt = performance.now();

  const observer = typeof PerformanceObserver === 'function'
    ? new PerformanceObserver((list) => {
      list.getEntries()
        .filter((entry) => APP_SCRIPT.test(entry.name))
        .forEach((entry) => scripts.add(entry.name));
    })
    : null;
  observer?.observe({ type: 'resource', buffered: true });

  const isStylesheetSettled = (link) =>
    link.sheet !== null || link.dataset.bootFailed !== undefined;

  const isAppReady = () => html.hasAttribute('data-app-ready');

  const toMarkSquare = (rect) => {
    const size = Math.min(rect.width, rect.height);
    return { left: rect.left, top: rect.top + (rect.height - size) / 2, size };
  };

  const isOnScreen = (rect) =>
    rect.width > 0 && rect.bottom > 0 && rect.top < innerHeight;

  const toDrawnRect = (svg) => {
    const box = svg.getBoundingClientRect();
    const viewBox = svg.viewBox.baseVal;
    if (!viewBox?.width || !viewBox?.height) return box;

    const scale = Math.min(
      box.width / viewBox.width,
      box.height / viewBox.height,
    );
    const width = viewBox.width * scale;
    const height = viewBox.height * scale;

    return {
      left: box.left + (box.width - width) / 2,
      top: box.top + (box.height - height) / 2,
      width,
      height,
      bottom: box.top + (box.height + height) / 2,
    };
  };

  const findVisibleLogo = () =>
    Array.from(document.querySelectorAll('[data-boot-target] svg'))
      .map(toDrawnRect)
      .find(isOnScreen);

  const barStart = () => ({
    left: html.dir === 'rtl' ? innerWidth - BAR_START_SIZE : 0,
    top: 0,
    size: BAR_START_SIZE,
  });

  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  const flyLogoHome = () => {
    logo.style.opacity = '0';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const from = toMarkSquare(toDrawnRect(logo));
    const takeoff = performance.now();

    const step = (now) => {
      const t = Math.min((now - takeoff) / FLIGHT_MS, 1);
      const eased = easeOutCubic(t);
      const visibleLogo = findVisibleLogo();
      const to = visibleLogo ? toMarkSquare(visibleLogo) : barStart();
      const scale = 1 + (to.size / from.size - 1) * eased;

      logo.style.transform = `translate(${(to.left - from.left) * eased}px, ${
        (to.top - from.top) * eased
      }px) scale(${scale})`;

      if (t < 1 && logo.isConnected) requestAnimationFrame(step);
    };

    requestAnimationFrame(step);
  };

  const reveal = () => {
    html.dataset.boot = 'styled';

    if (performance.now() - startedAt < SPLASH_DELAY_MS) {
      loader.remove();
      return;
    }

    requestAnimationFrame(flyLogoHome);
    setTimeout(() => splash.remove(), HANDOFF_MS);
  };

  const complete = () => {
    loader.classList.add('is-complete');
    loader.style.setProperty('--boot-progress', '100%');
    observer?.disconnect();
    setTimeout(() => {
      loader.remove();
      delete html.dataset.boot;
    }, 700);
  };

  const tick = () => {
    const stylesDone = Array.from(
      document.querySelectorAll('link[data-boot-css]'),
    ).filter(isStylesheetSettled).length;
    const stylesProgress = Math.min(stylesDone / stylesTotal, 1);
    const scriptsProgress = Math.min(scripts.size / scriptsTotal, 1);
    const progress = STYLES_SHARE * stylesProgress +
      (1 - STYLES_SHARE) * 0.95 * scriptsProgress;
    const value = Math.floor(progress * 100);

    level.style.transform = `translateY(${
      LEVEL_EMPTY - (LEVEL_EMPTY - LEVEL_FULL) * stylesProgress
    }px)`;
    markLit.style.opacity = String(Math.max(0, (stylesProgress - 0.5) * 2));
    percent.textContent = `${value}%`;
    loader.setAttribute('aria-valuenow', String(value));
    loader.style.setProperty('--boot-progress', `${value}%`);

    const stylesTimedOut = performance.now() - startedAt >
      STYLES_TIMEOUT_MS;
    if (
      html.dataset.boot === 'loading' &&
      (stylesProgress === 1 || stylesTimedOut)
    ) {
      reveal();
    }

    if (!loader.isConnected) {
      observer?.disconnect();
      delete html.dataset.boot;
      return;
    }

    if (html.dataset.boot === 'styled' && isAppReady()) {
      complete();
      return;
    }

    requestAnimationFrame(tick);
  };

  tick();
})();
</script>
