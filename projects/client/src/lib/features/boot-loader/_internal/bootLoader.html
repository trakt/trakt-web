<script>
document.documentElement.dataset.boot = 'loading';
</script>

  --boot-background: oklch(99% 0.004 300);
  --boot-well: oklch(92% 0.008 300);
  --boot-mark: oklch(76% 0.012 300);

  --boot-well: oklch(30% 0.011 300);
  --boot-mark: oklch(62% 0.01 300);
  --boot-text: oklch(99% 0.004 300);

    );

  top: 0;
  inset-inline-start: 0;
  z-index: 2147483647;
  width: 100vw;
  height: 100vh;
  height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--boot-background);

  position: relative;
  animation: boot-loader-appear 300ms ease var(--boot-splash-delay) backwards;

  transform: translateY(50px);
  transition: transform 300ms ease-out;

  fill: var(--boot-accent);

  color: var(--boot-mark);

  color: #fefefe;

  transition: opacity 300ms ease-out;

  font-family: ui-monospace, Menlo, Consolas, monospace;

  font-variant-numeric: tabular-nums;

  clip-path: inset(0 0 0 calc(100% - var(--boot-progress, 0%)));

            d="M56.00 38.95A27.5 27.5 0 1 1 36.19 3.20M16.93 27.11L35.82 42.96M29.92 34.75L53.89 6.17M56.69 18.31L42.49 35.24M26.88 22.41L23.36 19.45" />

            />

          <use class="boot-loader-mark" href="#boot-loader-mark" />
          <use class="boot-loader-mark-lit" href="#boot-loader-mark" />
        </g>
      </svg>
      <div class="boot-loader-percent">0%</div>
    </div>
  </div>
  <div class="boot-loader-bar"></div>
</div>
<script>
(() => {
  const STYLES_SHARE = 0.4;
  const LEVEL_EMPTY = 50;
  const LEVEL_FULL = -4;
  const STYLES_TIMEOUT_MS = 20000;
  const SPLASH_FADE_MS = 300;
  const SPLASH_MIN_VISIBLE_MS = 500;
  const FILL_SETTLE_MS = 300;
  const HANDOFF_MS = 800;
  const APP_SCRIPT = /\/_app\/immutable\/.+\.js$/;

  const html = document.documentElement;
  const loader = document.querySelector('.boot-loader');
  const splash = loader.querySelector('.boot-loader-splash');
  const level = loader.querySelector('.boot-loader-level');
  const markLit = loader.querySelector('.boot-loader-mark-lit');
  const percent = loader.querySelector('.boot-loader-percent');

  const splashDelay = Number(loader.dataset.delay) || 0;
  const stylesTotal = Number(loader.dataset.css) || 1;
  const scriptsTotal = Number(loader.dataset.js) || 1;
  const scripts = new Set();
  const settledStylesheets = new Set();
  const startedAt = performance.now();
  let stylesReadyAt = null;

  const observer = typeof PerformanceObserver === 'function'
    ? new PerformanceObserver((list) => {
      list.getEntries()
        .filter((entry) => APP_SCRIPT.test(entry.name))
        .forEach((entry) => scripts.add(entry.name));
    })
    : null;
  observer?.observe({ type: 'resource', buffered: true });

  const isStylesheetSettled = (link) =>
    link.sheet !== null || link.dataset.bootFailed !== undefined;

  const isAppReady = () => html.hasAttribute('data-app-ready');

  const splashVisibleLongEnoughAt = startedAt + splashDelay +
    SPLASH_FADE_MS + SPLASH_MIN_VISIBLE_MS;

  const skipSplash = () => {
    html.dataset.boot = 'styled';
    splash.remove();
  };

  const reveal = () => {
    html.dataset.boot = 'styled';
    setTimeout(() => splash.remove(), HANDOFF_MS);
  };

  const handOff = (now) => {
    if (stylesReadyAt === null) stylesReadyAt = now;

    if (stylesReadyAt - startedAt < splashDelay) {
      skipSplash();
      return;
    }

    const handoffAt = Math.max(
      stylesReadyAt + FILL_SETTLE_MS,
      splashVisibleLongEnoughAt,
    );
    if (now >= handoffAt) reveal();
  };

  const complete = () => {
    loader.classList.add('is-complete');
    loader.style.setProperty('--boot-progress', '100%');
    observer?.disconnect();
    setTimeout(() => {
      loader.remove();
      delete html.dataset.boot;
    }, 700);
  };

  const tick = () => {
    document.querySelectorAll('link[data-boot-css]').forEach((link) => {
      if (isStylesheetSettled(link)) settledStylesheets.add(link);
    });
    const stylesDone = settledStylesheets.size;
    const stylesProgress = Math.min(stylesDone / stylesTotal, 1);
    const scriptsProgress = Math.min(scripts.size / scriptsTotal, 1);
    const progress = STYLES_SHARE * stylesProgress +
      (1 - STYLES_SHARE) * 0.95 * scriptsProgress;
    const value = Math.floor(progress * 100);

    level.style.transform = `translateY(${
      LEVEL_EMPTY - (LEVEL_EMPTY - LEVEL_FULL) * stylesProgress
    }px)`;
    markLit.style.opacity = String(Math.max(0, (stylesProgress - 0.5) * 2));
    percent.textContent = `${value}%`;
    loader.setAttribute('aria-valuenow', String(value));
    loader.style.setProperty('--boot-progress', `${value}%`);

    const now = performance.now();
    const stylesTimedOut = now - startedAt > STYLES_TIMEOUT_MS;
    if (
      html.dataset.boot === 'loading' &&
      (stylesProgress === 1 || stylesTimedOut)
    ) {
      handOff(now);
    }

    if (!loader.isConnected) {
      observer?.disconnect();
      delete html.dataset.boot;
      return;
    }

    if (html.dataset.boot === 'styled' && isAppReady()) {
      complete();
      return;
    }

    requestAnimationFrame(tick);
  };

  tick();
})();
</script>
